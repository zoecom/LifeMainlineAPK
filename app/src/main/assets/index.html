<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生主线</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:560px;margin:auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 16px}.brand{font-size:23px;font-weight:900}.date{font-size:12px;color:#667085;margin-top:3px}.hero{background:#111827;color:white;border-radius:24px;padding:20px;margin-bottom:12px}.hero h1{font-size:25px;margin:8px 0 16px}.bar{height:8px;background:#ffffff22;border-radius:9px}.fill{height:100%;background:white;border-radius:9px;width:0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.card,.stat{background:white;border:1px solid #e7e9ee;border-radius:18px;padding:15px;margin-bottom:12px}.stat b{font-size:23px}.muted{font-size:12px;color:#667085}.title{font-weight:800;margin-bottom:10px}.input,.note{width:100%;border:1px solid #e7e9ee;border-radius:13px;padding:12px;font-size:15px;background:#fafafa}.times{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.times button,button{border:0;border-radius:12px;padding:11px;font-weight:800;background:#eef0f3}.times .on,.primary{background:#111827;color:white}.task{padding:11px;border:1px solid #e7e9ee;border-radius:13px;margin-top:8px;display:flex;gap:8px}.task input{width:20px;height:20px}.timer{text-align:center;margin-top:10px}.num{font-size:42px;font-weight:900}.primary{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:9px;background:#fffffff2;border-top:1px solid #e7e9ee}.nav button.on{background:#111827;color:#fff}.page{display:none}.page.on{display:block}</style></head><body><main>
<div class="top"><div><div class="brand">人生主线</div><div class="date" id="date"></div></div></div>
<section id="home" class="page on"><div class="hero"><div class="muted" style="color:#aaa">今天只做一件最重要的事</div><h1>把碎片时间变成推进器</h1><div class="bar"><div class="fill" id="fill"></div></div><div class="muted" style="color:#aaa;margin-top:7px" id="progress">0 分钟 · 0 个任务</div></div>
<div class="stats"><div class="stat"><b id="mins">0</b><div class="muted">今日专注分钟</div></div><div class="stat"><b id="streak">0</b><div class="muted">连续推进天数</div></div></div>
<div class="card"><div class="title">今日主线</div><input class="input" id="goal" placeholder="今天最重要的一件事"></div>
<div class="card"><div class="title">有几分钟，就做几分钟</div><div class="times"><button class="on" data-m="5">5分</button><button data-m="10">10分</button><button data-m="20">20分</button><button data-m="30">30分</button></div><div id="tasks"></div><div class="timer"><div class="num" id="num">05:00</div><button class="primary" id="start">开始专注</button></div></div>
<div class="card"><div class="title">今天复盘</div><textarea class="note" id="note" rows="4" placeholder="今天什么事情真正推动了我的人生？"></textarea><button class="primary" id="save" style="margin-top:8px">保存</button></div></section>
<section id="goals" class="page"><div class="card"><div class="title">我的长期主线</div><div id="goalList"></div><button class="primary" id="add">+ 添加主线</button></div></section>
<section id="history" class="page"><div class="card"><div class="title">推进记录</div><div id="hist"></div></div></section>
</main><div class="nav"><button class="on" data-p="home">今天</button><button data-p="goals">主线</button><button data-p="history">记录</button></div>
<script>
const K='lm1',d=JSON.parse(localStorage.getItem(K)||'{}'),today=new Date().toISOString().slice(0,10);d.days=d.days||{};d.goals=d.goals||[];d.days[today]=d.days[today]||{m:0,n:0,note:'',goal:''};const day=d.days[today];const save=()=>localStorage.setItem(K,JSON.stringify(d));document.getElementById('date').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});const goal=document.getElementById('goal');goal.value=day.goal;goal.onchange=()=>{day.goal=goal.value;save()};document.getElementById('note').value=day.note;document.getElementById('save').onclick=()=>{day.note=document.getElementById('note').value;save();alert('已保存')};
let selected=5,timer=0,iv;const render=()=>{document.getElementById('mins').textContent=day.m;document.getElementById('progress').textContent=day.m+' 分钟 · '+day.n+' 个任务';document.getElementById('fill').style.width=Math.min(day.m/60*100,100)+'%';let s=0,dt=new Date(today);while(d.days[dt.toISOString().slice(0,10)]?.n>0){s++;dt.setDate(dt.getDate()-1)}document.getElementById('streak').textContent=s;document.getElementById('tasks').innerHTML=['明确一个下一步动作','整理一个有价值的想法','完成一个小输出'].map((x,i)=>'<label class="task"><input type="checkbox" data-i="'+i+'"><span><b>'+x+'</b><br><small class="muted">'+selected+' 分钟内完成</small></span></label>').join('');document.querySelectorAll('#tasks input').forEach(x=>x.onchange=()=>{if(x.checked){day.n++;day.m+=selected;save();render();}})};document.querySelectorAll('.times button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.times button').forEach(x=>x.classList.remove('on'));b.classList.add('on');selected=+b.dataset.m;document.getElementById('num').textContent=String(selected).padStart(2,'0')+':00'});document.getElementById('start').onclick=()=>{clearInterval(iv);timer=selected*60;iv=setInterval(()=>{timer--;document.getElementById('num').textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0');if(timer<=0){clearInterval(iv);day.m+=selected;save();render();alert('完成！今天又向前推进了一步。')}},1000)};document.getElementById('add').onclick=()=>{let x=prompt('输入长期主线');if(x){d.goals.push(x);save();renderGoals()}};function renderGoals(){document.getElementById('goalList').innerHTML=d.goals.map((x,i)=>'<div class="task"><span style="flex:1">'+x+'</span><button onclick="d.goals.splice('+i+',1);save();renderGoals()">删除</button></div>').join('')||'<div class="muted">还没有长期主线。</div>'}function hist(){document.getElementById('hist').innerHTML=Object.keys(d.days).sort().reverse().map(x=>'<div class="task"><span style="flex:1"><b>'+x+'</b><br><small class="muted">'+d.days[x].m+' 分钟 · '+d.days[x].n+' 个任务</small></span></div>').join('')}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(b.dataset.p).classList.add('on');if(b.dataset.p==='goals')renderGoals();if(b.dataset.p==='history')hist()});render();renderGoals();
</script></body></html>
